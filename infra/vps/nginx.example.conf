# VPS-1: an authenticating reverse proxy in front of `canon serve`, nginx form of
# infra/vps/Caddyfile.example. Read that file's header first: the same VPS-2 rule
# applies here. proxy_set_header Host below MUST stay the loopback authority canon
# serve is bound to; forwarding $host (the client's original Host) is exactly the
# regression test/unit/vps-proxy-examples.test.mjs checks for, and canon serve itself
# refuses it with 421 even though nginx's own auth already passed.
#
# Replace <public-name-or-ip>, the cert paths, and auth_basic_user_file for your setup.
# Generate the password file with: htpasswd -c /etc/nginx/canon.htpasswd reviewer

server {
	listen 443 ssl;
	server_name <public-name-or-ip>;

	ssl_certificate     /etc/ssl/canon-proof/fullchain.pem;
	ssl_certificate_key /etc/ssl/canon-proof/privkey.pem;

	auth_basic "canon review";
	auth_basic_user_file /etc/nginx/canon.htpasswd;

	# canon serve --root <store> --port 8791 (loopback default; no --host/--tailscale)
	location / {
		proxy_pass http://127.0.0.1:8791;
		proxy_set_header Host 127.0.0.1:8791;
	}
}
