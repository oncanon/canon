# Conventional Commits on main -> one open release PR (next SemVer version + CHANGELOG.md).
# Merging that PR tags vX.Y.Z, creates a DRAFT GitHub Release, and runs release.yml for the tag.
# release.yml publishes the draft only after every build, signing and notarization step passed.
# A tag made with GITHUB_TOKEN starts no other workflow, so release.yml is called from here.
name: release-please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The release PR is opened with GITHUB_TOKEN, so its pull_request runs start no jobs (seen on PR #6).
  # So test it here on every push to main, not only when release-please opens or updates it: a push
  # that the changelog ignores (ci:, test:) leaves the PR as it was but changes what a merge ships.
  # The tested commit is GitHub's merge of the PR onto this push, which is the code a merge releases.
  find-release-pr:
    needs: release-please
    if: needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      found: ${{ steps.find.outputs.found }}
      sha: ${{ steps.find.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.sha }}
        run: .github/scripts/release-pr-merge-ref.sh

  test-release-pr:
    needs: find-release-pr
    if: needs.find-release-pr.outputs.found == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.find-release-pr.outputs.sha }}

  release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      dry_run: false
    secrets: inherit
