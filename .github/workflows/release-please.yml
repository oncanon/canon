# Conventional Commits on main -> one open release PR (next SemVer version + CHANGELOG.md).
# Merging that PR tags vX.Y.Z, creates a DRAFT GitHub Release, and runs release.yml for the tag.
# release.yml publishes the draft only after every build, signing and notarization step passed.
# A tag made with GITHUB_TOKEN starts no other workflow, so release.yml is called from here.
name: release-please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
      prs_created: ${{ steps.rp.outputs.prs_created }}
      pr: ${{ steps.rp.outputs.pr }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The release PR is opened with GITHUB_TOKEN, so its pull_request runs start no jobs (seen on PR #6).
  # Test its branch here each time release-please opens or updates it: it is the commit that bumps
  # the version, and the release tag is cut from it on merge.
  test-release-pr:
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}

  release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      dry_run: false
    secrets: inherit
