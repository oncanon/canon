# Runs the full test suite on macOS with every external tool it needs.
# - Pull request to main -> tests the PR's merge commit.
# - workflow_call -> tests the given ref. release.yml calls it for the release tag. release-please.yml
#   calls it for the merge of its open release PR onto main, because a PR opened with GITHUB_TOKEN
#   gets no working pull_request workflow, and that PR is the one that bumps the version.
name: test

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Git ref to test
        type: string
        required: true

permissions: {}

jobs:
  test:
    runs-on: macos-15
    concurrency:
      group: test-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || inputs.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the Playwright browsers the suite launches
        run: node node_modules/playwright-core/cli.js install chromium webkit
      - name: Install pandoc, at the major version the suite expects
        run: |
          brew install pandoc
          pandoc --version
          [[ "$(pandoc --version | head -1)" =~ ^pandoc\ 3\. ]] || { echo "::error::pandoc is not a 3.x release"; exit 1; }
      - run: npm test
